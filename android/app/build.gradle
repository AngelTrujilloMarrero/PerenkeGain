apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

def ndkVersionString = "28.1.13356709"

android {
    compileSdk 35
    ndkVersion ndkVersionString
    namespace "com.perenkegain.editor"
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }
    signingConfigs {
        juceSigning {
            storeFile     file("${rootDir}${File.separator}debug.keystore")
            storePassword "android"
            keyAlias      "androiddebugkey"
            keyPassword   "android"
            storeType     "jks"
        }
    }

    defaultConfig {
        applicationId "com.perenkegain.editor"
        minSdkVersion    26
        targetSdkVersion 35
        ndk {
            abiFilters "arm64-v8a"
        }
        python {
            version "3.12"
            pip {
                install "yt-dlp"
                install "certifi"
            }
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_TOOLCHAIN=clang", "-DANDROID_PLATFORM=android-26", "-DANDROID_STL=c++_static", "-DANDROID_CPP_FEATURES=exceptions rtti", "-DANDROID_ARM_MODE=arm", "-DANDROID_ARM_NEON=TRUE", "-DANDROID_WEAK_API_DEFS=ON", "-DCMAKE_CXX_STANDARD=20", "-DCMAKE_CXX_EXTENSIONS=OFF"
            }
        }
    }

    buildTypes {
         debug {
             initWith debug
             debuggable    true
             jniDebuggable true
             signingConfig signingConfigs.juceSigning
         }
         release {
             initWith release
             debuggable    false
             jniDebuggable false
             signingConfig signingConfigs.juceSigning
         }
    }

    flavorDimensions "default"
    productFlavors {
        debug_ {
            ndk {
                abiFilters "arm64-v8a"
            }
            externalNativeBuild {
                cmake {
                    cFlags    "-O2"
                    cppFlags  "-O2"
                    arguments "-DJUCE_BUILD_CONFIGURATION=DEBUG"
                }
            }

            dimension "default"
        }
        release_ {
            ndk {
                abiFilters "arm64-v8a"
            }
            externalNativeBuild {
                cmake {
                    cFlags    "-O3"
                    cppFlags  "-O3"
                    arguments "-DJUCE_BUILD_CONFIGURATION=RELEASE"
                }
            }

            dimension "default"
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (names.contains ("debug_")
              && variant.buildType.name != "debug") {
            setIgnore(true)
        }
        if (names.contains ("release_")
              && variant.buildType.name != "release") {
            setIgnore(true)
        }
    }

    sourceSets {
        main.java.srcDirs +=
            ["../../JUCE/modules/juce_core/native/javacore/init",
             "../../JUCE/modules/juce_core/native/javacore/app",
             "../../JUCE/modules/juce_gui_basics/native/javaopt/app",
             "../../android-java"]

        main.res.srcDirs +=
            []
    }

    repositories {
    }

    dependencies {
        implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.9'
    }



}

