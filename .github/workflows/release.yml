name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CPLUS_INCLUDE_PATH: /usr/include/freetype2:/usr/include/libpng16
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            mesa-common-dev libgl1-mesa-dev libfontconfig-dev \
            libcurl4-openssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: lukka/get-cmake@latest
      - run: cmake --preset linux-release
      - run: cmake --build --preset linux-release
      - name: Package
        run: |
          cd build/linux-release/PerenkeGain_artefacts/Release
          tar -czf "$GITHUB_WORKSPACE/PerenkeGain-linux-x86_64.tar.gz" PerenkeGain
      - uses: softprops/action-gh-release@v2
        with:
          files: PerenkeGain-linux-x86_64.tar.gz
          generate_release_notes: true
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - run: cmake --preset macos-release
      - run: cmake --build --preset macos-release
      - name: Tools
        run: |
          tools="build/macos-release/PerenkeGain_artefacts/Release/PerenkeGain.app/Contents/MacOS/tools"
          mkdir -p "$tools"
          curl -L --retry 3 -o "$tools/yt-dlp" \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          curl -L --retry 3 -o "$tools/ffmpeg" \
            https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-darwin-arm64
          chmod +x "$tools/yt-dlp" "$tools/ffmpeg"
      - name: Package
        run: |
          cd build/macos-release/PerenkeGain_artefacts/Release
          ditto -c -k --sequesterRsrc --keepParent PerenkeGain.app \
            "$GITHUB_WORKSPACE/PerenkeGain-macos.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: PerenkeGain-macos.zip
          generate_release_notes: true
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Ninja
        run: choco install ninja -y
      - uses: lukka/get-cmake@latest
      - run: cmake --preset windows-release
      - run: cmake --build --preset windows-release
      - name: Package
        run: |
          $stage = "$env:RUNNER_TEMP\pkg"
          New-Item -ItemType Directory -Force -Path "$stage\tools" | Out-Null
          Copy-Item "build\windows-release\PerenkeGain_artefacts\Release\PerenkeGain.exe" $stage
          curl.exe -L --retry 3 -o "$stage\tools\yt-dlp.exe" `
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          curl.exe -L --retry 3 -o "$stage\tools\ffmpeg.exe" `
            https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-win32-x64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path "$stage\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\PerenkeGain-windows-x64.zip" -Force
      - uses: softprops/action-gh-release@v2
        with:
          files: PerenkeGain-windows-x64.zip
          generate_release_notes: true
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JUCE
        run: git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git JUCE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: SDK
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses
          "$SM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.1.13356709" "cmake;3.22.1"
      - name: Firmar
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: release Android omitida (firma debug no valida para publicar)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
      - name: APK firmado
        if: steps.sign.outputs.skip != '1'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
      - name: Artefacto
        if: steps.sign.outputs.skip != '1'
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          cp "$APK" "$GITHUB_WORKSPACE/PerenkeGain-android.apk"
      - uses: softprops/action-gh-release@v2
        if: steps.sign.outputs.skip != '1'
        with:
          files: PerenkeGain-android.apk
          generate_release_notes: true
